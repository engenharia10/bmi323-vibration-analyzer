; BMI323 Vibration Analyzer - ESP32-S3
; ---------------------------------------------------------------
; Analisador de vibracao: le o acelerometro BMI323 via FIFO em alta
; taxa, calcula FFT no proprio ESP32 e serve uma interface web
; (pasta data/, LittleFS) com espectro, waterfall, osciloscopio e
; projeto interativo de filtros notch/lowpass.
;
;   pio run -t upload          -> firmware
;   pio run -t uploadfs        -> interface web (pasta data/)
;   pio device monitor         -> log serial
; ---------------------------------------------------------------

[platformio]
default_envs = waveshare-s3-touch-7

[env]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 2000000
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

board_build.filesystem  = littlefs
board_build.partitions  = partitions_custom.csv

; PSRAM: a maioria das devkits S3 com memoria externa (N8R8 / N16R8) usa
; PSRAM octal -> qio_opi. Se a sua placa for de PSRAM quad (ex. N8R2),
; troque para qio_qspi. Sem PSRAM, o firmware cai de volta na RAM interna
; sozinho (avisa no serial), entao errar aqui nao impede de rodar.
board_build.arduino.memory_type = qio_opi

build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM

lib_deps =
  ESP32Async/AsyncTCP @ ^3.4.0
  ESP32Async/ESPAsyncWebServer @ ^3.7.0


; ---------------------------------------------------------------
; Placa generica com o BMI323 no SPI (mais rapido; ODR ate 6.4 kHz)
; ---------------------------------------------------------------
[env:devkit-spi]
build_flags =
  ${env.build_flags}
  -DBMI_USE_SPI=1
  ; devkits com conversor USB-UART: o Serial sai pela UART0
  -DARDUINO_USB_CDC_ON_BOOT=0


; ---------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-7 (800x480, N8R8) com o BMI323 no
; conector I2C (header P4).
;
; O barramento I2C da placa (GPIO8/9) e COMPARTILHADO com o touch
; GT911 (0x5D/0x14) e o expansor CH422G (0x24). Nao ha conflito de
; endereco com o BMI323 (0x68/0x69), mas o clock fica em 400 kHz:
; o GT911 nao acompanha Fm+ (1 MHz).
;
; Teto medido nesta placa, com o giroscopio ligado (6 words por quadro):
;   800 Hz  -> 794 Hz reais   (ok, folga grande)
;   1600 Hz -> 1589 Hz reais  (ok, ~50% do barramento)
;   3200 Hz -> 2484 Hz reais  (satura: perde amostra)
; Se um dia o touch GT911 for usado no mesmo barramento, volte para 800.
; ---------------------------------------------------------------
[env:waveshare-s3-touch-7]
build_flags =
  ${env.build_flags}
  -DBMI_USE_SPI=0
  -DBMI_I2C_HZ_OVERRIDE=400000UL
  -DBMI_DEFAULT_ODR_HZ=1600
  ; a placa tem ponte USB-UART CH343: o Serial sai pela UART0.
  ; Se algum dia usar uma placa de USB nativa, troque para 1.
  -DARDUINO_USB_CDC_ON_BOOT=0
