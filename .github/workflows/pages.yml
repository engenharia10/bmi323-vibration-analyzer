# Publica a interface web (pasta data/) no GitHub Pages.
#
# A mesma pagina que roda no ESP32 abre no navegador sozinha: quando o
# fetch de api/config falha, o app cai na previa local e gera o sinal pelo
# simulador embutido. Serve de demonstracao sem placa nenhuma.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # O guia mora na raiz do repo, nao em data/ - e o GitHub nao renderiza
      # HTML no navegador de arquivos, so mostra o fonte. Copiar para o site
      # publicado e o que lhe da um endereco onde ele abre de verdade.
      - run: cp guia-filtros.html data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data
      - id: deployment
        uses: actions/deploy-pages@v4
